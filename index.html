
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>这是一个数独 - 艺术与逻辑</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-paper: #fefcf0;
            --ink-black: #2d3436;
            --accent-orange: #ff7675;
            --teal-ink: #00b894;
        }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: var(--bg-paper);
            background-image: url("https://www.transparenttextures.com/patterns/natural-paper.png");
            min-height: 100vh;
            overflow-x: hidden;
        }
        /* 手绘风边框效果 */
        .hand-drawn-border {
            border: 2px solid var(--ink-black);
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
        }
        .hand-drawn-shadow {
            box-shadow: 4px 4px 0px var(--ink-black);
        }
        /* 抽象互动形状 */
        .blob {
            position: absolute;
            width: 150px;
            height: 150px;
            background: var(--accent-orange);
            filter: blur(40px);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.3;
            transition: all 1s ease-in-out;
        }
        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(20px, 30px) scale(1.1); }
            100% { transform: translate(0, 0) scale(1); }
        }
        .animate-drift {
            animation: drift 8s infinite ease-in-out;
        }
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop-in {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        /* 冲突闪烁动画 */
        @keyframes flashRed {
            0%, 100% { background-color: transparent; }
            50% { background-color: rgba(239, 68, 68, 0.3); }
        }
        .animate-flash-red {
            animation: flashRed 0.5s ease-in-out 4; /* 2秒内闪烁4次 */
        }

        /* 手绘震动滤镜 */
        .hand-drawn-wiggle {
            filter: url(#wiggle-filter);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="text-slate-900">
    <div id="root"></div>

    <!-- SVG 滤镜定义 -->
    <svg style="display: none;">
        <defs>
            <filter id="wiggle-filter">
                <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="1">
                    <animate attributeName="seed" values="1;2;3" dur="0.2s" repeatCount="indefinite" />
                </feTurbulence>
                <feDisplacementMap in="SourceGraphic" scale="2" />
            </filter>
        </defs>
    </svg>

    <!-- 底部装饰线 -->
    <svg style="position:fixed; bottom:0; width:100%; height:20px; z-index:-1" preserveAspectRatio="none">
        <path d="M0 10 Q 250 20 500 10 T 1000 10" stroke="#2d3436" stroke-width="2" fill="none" opacity="0.2"/>
    </svg>
<script type="module" src="/index.tsx"></script>
</body>
</html>
